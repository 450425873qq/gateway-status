name: probe

on:
  workflow_dispatch:
    inputs:
      relay:
        description: '常驻待命模式（接力链自动触发选 true；手动单轮探测选 false）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe
        env:
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          SERIES: deepseek,kimi,glm
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: 450425873qq/gateway-status
          GATEWAY_DINGTALK_WEBHOOK: ${{ secrets.GATEWAY_DINGTALK_WEBHOOK }}
          RELAY: ${{ inputs.relay }}
        run: python probe.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
