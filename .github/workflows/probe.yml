name: probe

on:
  schedule:
    # 互补调度：本地探针跑（北京工作日 8:30-18:30）时云端避让，其余时段云端每 10 分钟一轮
    # UTC = 北京时间 - 8 小时
    - cron: "0,10,20 0 * * 1-5"        # 北京工作日 8:00-8:20（本地窗口开始前）
    - cron: "35,45,55 10 * * 1-5"      # 北京工作日 18:35-18:55（本地窗口结束后）
    - cron: "*/10 11-23 * * 1-5"       # 北京 19:00-次日 7:55
    - cron: "*/10 * * * 6,0"           # 北京周六 8:00 至周一 7:55（周末全天）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe
        env:
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          SERIES: deepseek,kimi,glm
          # 手动触发（workflow_dispatch）随时可跑；cron 触发仅限探测时段
          PROBE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python probe.py

      - name: Commit data
        run: |
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
