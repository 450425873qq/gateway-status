name: probe

on:
  schedule:
    # 北京时间工作日（周一至周五）8:30-18:30 每 5 分钟一轮
    # UTC = 北京时间 - 8 小时 → 周一至周五 UTC 0:30-9:55 及 10:00-10:30
    - cron: "30,35,40,45,50,55 0-9 * * 1-5"
    - cron: "0,5,10,15,20,25,30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run probe
        env:
          GATEWAY_BASE_URL: ${{ secrets.GATEWAY_BASE_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          SERIES: deepseek,kimi,glm
          # 手动触发（workflow_dispatch）随时可跑；cron 触发仅限探测时段
          PROBE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python probe.py

      - name: Commit data
        run: |
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
